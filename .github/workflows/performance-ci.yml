name: JMeter Performance Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test'
        required: true
        default: 'load'
        type: choice
        options:
          - load
          - stress
          - spike
          - endurance
      thread_count:
        description: 'Number of virtual users (Load: 10, Stress: 50, Spike: 30, Endurance: 5)'
        required: false
        default: '10'
      ramp_up:
        description: 'Ramp-up period in seconds'
        required: false
        default: '30'
      duration:
        description: 'Test duration in seconds (Endurance default: 3600)'
        required: false
        default: '300'
  schedule:
    # Run weekly Load Test on Monday at 6 AM UTC
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  JMETER_VERSION: '5.6.3'
  JAVA_VERSION: '17'

jobs:
  performance-test:
    name: Execute ${{ github.event.inputs.test_type || 'load' }} Test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache JMeter installation
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: ~/jmeter
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Download and Install JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          echo "Downloading JMeter ${{ env.JMETER_VERSION }}..."
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${{ env.JMETER_VERSION }}.tgz
          tar -xzf apache-jmeter-${{ env.JMETER_VERSION }}.tgz
          mv apache-jmeter-${{ env.JMETER_VERSION }} ~/jmeter
          rm apache-jmeter-${{ env.JMETER_VERSION }}.tgz
          echo "JMeter installed successfully"

      - name: Verify JMeter installation
        run: |
          ~/jmeter/bin/jmeter --version

      - name: Create results directory
        run: mkdir -p ./results

      - name: Set test configuration
        id: config
        run: |
          TEST_TYPE="${{ github.event.inputs.test_type || 'load' }}"
          echo "test_type=$TEST_TYPE" >> $GITHUB_OUTPUT

          # Set test file based on test type
          case $TEST_TYPE in
            load)
              echo "test_file=juice_shop_load.jmx" >> $GITHUB_OUTPUT
              echo "default_threads=10" >> $GITHUB_OUTPUT
              echo "default_duration=300" >> $GITHUB_OUTPUT
              echo "default_ramp_up=30" >> $GITHUB_OUTPUT
              ;;
            stress)
              echo "test_file=juice_shop_stress.jmx" >> $GITHUB_OUTPUT
              echo "default_threads=50" >> $GITHUB_OUTPUT
              echo "default_duration=300" >> $GITHUB_OUTPUT
              echo "default_ramp_up=120" >> $GITHUB_OUTPUT
              ;;
            spike)
              echo "test_file=juice_shop_spike.jmx" >> $GITHUB_OUTPUT
              echo "default_threads=30" >> $GITHUB_OUTPUT
              echo "default_duration=150" >> $GITHUB_OUTPUT
              echo "default_ramp_up=10" >> $GITHUB_OUTPUT
              ;;
            endurance)
              echo "test_file=juice_shop_endurance.jmx" >> $GITHUB_OUTPUT
              echo "default_threads=5" >> $GITHUB_OUTPUT
              echo "default_duration=3600" >> $GITHUB_OUTPUT
              echo "default_ramp_up=60" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Run JMeter Performance Tests
        run: |
          TEST_TYPE="${{ steps.config.outputs.test_type }}"
          TEST_FILE="${{ steps.config.outputs.test_file }}"

          # Use input values or defaults based on test type
          THREADS="${{ github.event.inputs.thread_count || steps.config.outputs.default_threads }}"
          DURATION="${{ github.event.inputs.duration || steps.config.outputs.default_duration }}"
          RAMP_UP="${{ github.event.inputs.ramp_up || steps.config.outputs.default_ramp_up }}"

          echo "========================================"
          echo "   PERFORMANCE TEST EXECUTION"
          echo "========================================"
          echo "Test Type: $TEST_TYPE"
          echo "Test File: $TEST_FILE"
          echo "Thread Count: $THREADS"
          echo "Ramp-up: $RAMP_UP seconds"
          echo "Duration: $DURATION seconds"
          echo "Target: https://preview.owasp-juice.shop"
          echo "========================================"

          # Build JMeter command based on test type
          case $TEST_TYPE in
            load)
              ~/jmeter/bin/jmeter -n \
                -t ./tests/$TEST_FILE \
                -l ./results/log.jtl \
                -e -o ./results/dashboard/ \
                -JTHREAD_COUNT=$THREADS \
                -JRAMP_UP=$RAMP_UP \
                -JDURATION=$DURATION \
                -j ./results/jmeter.log
              ;;
            stress)
              ~/jmeter/bin/jmeter -n \
                -t ./tests/$TEST_FILE \
                -l ./results/log.jtl \
                -e -o ./results/dashboard/ \
                -JMAX_THREADS=$THREADS \
                -JRAMP_UP=$RAMP_UP \
                -JDURATION=$DURATION \
                -j ./results/jmeter.log
              ;;
            spike)
              ~/jmeter/bin/jmeter -n \
                -t ./tests/$TEST_FILE \
                -l ./results/log.jtl \
                -e -o ./results/dashboard/ \
                -JBASELINE_THREADS=5 \
                -JSPIKE_THREADS=$THREADS \
                -JBASELINE_DURATION=60 \
                -JSPIKE_DURATION=30 \
                -j ./results/jmeter.log
              ;;
            endurance)
              ~/jmeter/bin/jmeter -n \
                -t ./tests/$TEST_FILE \
                -l ./results/log.jtl \
                -e -o ./results/dashboard/ \
                -JTHREAD_COUNT=$THREADS \
                -JRAMP_UP=$RAMP_UP \
                -JDURATION=$DURATION \
                -j ./results/jmeter.log
              ;;
          esac

          echo "========================================"
          echo "   TEST EXECUTION COMPLETED"
          echo "========================================"

      - name: Generate Landing Page with Live Metrics
        if: always()
        shell: bash
        run: |
          if [ -f ./results/log.jtl ]; then
            # Parse JTL file for metrics
            TOTAL_REQUESTS=$(tail -n +2 ./results/log.jtl | wc -l)
            FAILED_REQUESTS=$(tail -n +2 ./results/log.jtl | grep -c ",false," || echo "0")
            SUCCESS_REQUESTS=$((TOTAL_REQUESTS - FAILED_REQUESTS))
            ERROR_RATE=$(awk "BEGIN {printf \"%.2f\", ($FAILED_REQUESTS / $TOTAL_REQUESTS) * 100}")
            SUCCESS_RATE=$(awk "BEGIN {printf \"%.2f\", ($SUCCESS_REQUESTS / $TOTAL_REQUESTS) * 100}")

            # Calculate P95 response time
            P95_VALUE=$(tail -n +2 ./results/log.jtl | cut -d',' -f2 | sort -n | awk 'BEGIN{c=0} {a[c++]=$1} END{print a[int(c*0.95)]}')

            # Get test configuration
            TEST_TYPE="${{ steps.config.outputs.test_type }}"
            VIRTUAL_USERS="${{ github.event.inputs.thread_count || steps.config.outputs.default_threads }}"
            DURATION="${{ github.event.inputs.duration || steps.config.outputs.default_duration }}"
            RUN_NUMBER="${{ github.run_number }}"
            TEST_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

            # Determine pass/fail status for thresholds
            ERROR_THRESHOLD=1.0
            P95_THRESHOLD=800

            if (( $(echo "$ERROR_RATE <= $ERROR_THRESHOLD" | bc -l) )); then
              ERROR_BADGE="badge-success"
              ERROR_STATUS="PASS"
            else
              ERROR_BADGE="badge-warning"
              ERROR_STATUS="FAIL"
            fi

            if [ "$P95_VALUE" -le "$P95_THRESHOLD" ]; then
              P95_BADGE="badge-success"
              P95_STATUS="PASS"
            else
              P95_BADGE="badge-warning"
              P95_STATUS="FAIL"
            fi

            # Generate index.html from template
            cp ./docs/index.template.html ./docs/index.html
            sed -i "s/{{TEST_TYPE}}/$TEST_TYPE/g" ./docs/index.html
            sed -i "s/{{RUN_NUMBER}}/$RUN_NUMBER/g" ./docs/index.html
            sed -i "s/{{TEST_DATE}}/$TEST_DATE/g" ./docs/index.html
            sed -i "s/{{TOTAL_REQUESTS}}/$TOTAL_REQUESTS/g" ./docs/index.html
            sed -i "s/{{SUCCESS_RATE}}/$SUCCESS_RATE/g" ./docs/index.html
            sed -i "s/{{ERROR_RATE}}/$ERROR_RATE/g" ./docs/index.html
            sed -i "s/{{ERROR_BADGE}}/$ERROR_BADGE/g" ./docs/index.html
            sed -i "s/{{ERROR_STATUS}}/$ERROR_STATUS/g" ./docs/index.html
            sed -i "s/{{P95_VALUE}}/$P95_VALUE/g" ./docs/index.html
            sed -i "s/{{P95_BADGE}}/$P95_BADGE/g" ./docs/index.html
            sed -i "s/{{P95_STATUS}}/$P95_STATUS/g" ./docs/index.html
            sed -i "s/{{VIRTUAL_USERS}}/$VIRTUAL_USERS/g" ./docs/index.html
            sed -i "s/{{DURATION}}/$DURATION/g" ./docs/index.html

            echo "Generated index.html with live metrics"
            echo "  Total Requests: $TOTAL_REQUESTS"
            echo "  Success Rate: $SUCCESS_RATE%"
            echo "  Error Rate: $ERROR_RATE% ($ERROR_STATUS)"
            echo "  P95 Response: ${P95_VALUE}ms ($P95_STATUS)"
          else
            echo "No JTL file found, keeping template as index.html"
            cp ./docs/index.template.html ./docs/index.html
            sed -i "s/{{TEST_TYPE}}/N\/A/g" ./docs/index.html
            sed -i "s/{{RUN_NUMBER}}/${{ github.run_number }}/g" ./docs/index.html
            sed -i "s/{{TEST_DATE}}/No test data/g" ./docs/index.html
            sed -i "s/{{TOTAL_REQUESTS}}/0/g" ./docs/index.html
            sed -i "s/{{SUCCESS_RATE}}/0/g" ./docs/index.html
            sed -i "s/{{ERROR_RATE}}/0/g" ./docs/index.html
            sed -i "s/{{ERROR_BADGE}}/badge-info/g" ./docs/index.html
            sed -i "s/{{ERROR_STATUS}}/N\/A/g" ./docs/index.html
            sed -i "s/{{P95_VALUE}}/0/g" ./docs/index.html
            sed -i "s/{{P95_BADGE}}/badge-info/g" ./docs/index.html
            sed -i "s/{{P95_STATUS}}/N\/A/g" ./docs/index.html
            sed -i "s/{{VIRTUAL_USERS}}/0/g" ./docs/index.html
            sed -i "s/{{DURATION}}/0/g" ./docs/index.html
          fi

      - name: Publish Dashboard to GitHub Pages
        if: always()
        run: |
          TEST_TYPE="${{ steps.config.outputs.test_type }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          # Create directories
          mkdir -p ./docs/dashboards/latest
          mkdir -p ./docs/dashboards/history/${TEST_TYPE}

          # Copy dashboard to latest
          if [ -d ./results/dashboard ]; then
            cp -r ./results/dashboard/* ./docs/dashboards/latest/
            echo "Copied dashboard to docs/dashboards/latest/"

            # Archive to history (keep last 10 runs per test type)
            cp -r ./results/dashboard ./docs/dashboards/history/${TEST_TYPE}/${TIMESTAMP}
            echo "Archived dashboard to docs/dashboards/history/${TEST_TYPE}/${TIMESTAMP}/"

            # Cleanup old history (keep only last 10)
            cd ./docs/dashboards/history/${TEST_TYPE}
            ls -t | tail -n +11 | xargs -r rm -rf
            cd -
          else
            echo "No dashboard directory found, skipping copy"
          fi

      - name: Validate Performance Thresholds
        if: always()
        shell: bash
        run: |
          if [ -f ./results/log.jtl ]; then
            # Calculate metrics
            TOTAL=$(tail -n +2 ./results/log.jtl | wc -l)
            FAILED=$(tail -n +2 ./results/log.jtl | grep -c ",false," || echo "0")
            ERROR_RATE=$(awk "BEGIN {printf \"%.2f\", ($FAILED / $TOTAL) * 100}")

            # Calculate P95 (simplified - get 95th percentile of elapsed times)
            P95=$(tail -n +2 ./results/log.jtl | cut -d',' -f2 | sort -n | awk 'BEGIN{c=0} {a[c++]=$1} END{print a[int(c*0.95)]}')

            # Define thresholds
            ERROR_THRESHOLD=1.0
            P95_THRESHOLD=800

            # Generate threshold validation report
            echo "## Performance Threshold Validation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

            # Check error rate
            if (( $(echo "$ERROR_RATE <= $ERROR_THRESHOLD" | bc -l) )); then
              echo "| Error Rate | ${ERROR_RATE}% | <= ${ERROR_THRESHOLD}% | PASS |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Error Rate | ${ERROR_RATE}% | <= ${ERROR_THRESHOLD}% | WARNING |" >> $GITHUB_STEP_SUMMARY
              echo "::warning::Error rate (${ERROR_RATE}%) exceeds threshold (${ERROR_THRESHOLD}%)"
            fi

            # Check P95
            if [ "$P95" -le "$P95_THRESHOLD" ]; then
              echo "| P95 Response Time | ${P95}ms | <= ${P95_THRESHOLD}ms | PASS |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| P95 Response Time | ${P95}ms | <= ${P95_THRESHOLD}ms | WARNING |" >> $GITHUB_STEP_SUMMARY
              echo "::warning::P95 response time (${P95}ms) exceeds threshold (${P95_THRESHOLD}ms)"
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** Warnings do not fail the build. Review results for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate Performance Summary
        if: always()
        run: |
          TEST_TYPE="${{ steps.config.outputs.test_type }}"

          echo "## $TEST_TYPE Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Test type description
          echo "### Test Type Description" >> $GITHUB_STEP_SUMMARY
          case $TEST_TYPE in
            load)
              echo "**Load Test**: Validates system performance under expected normal load conditions." >> $GITHUB_STEP_SUMMARY
              ;;
            stress)
              echo "**Stress Test**: Pushes the system beyond normal capacity to find breaking points." >> $GITHUB_STEP_SUMMARY
              ;;
            spike)
              echo "**Spike Test**: Tests system resilience against sudden traffic surges." >> $GITHUB_STEP_SUMMARY
              ;;
            endurance)
              echo "**Endurance Test**: Extended duration test to detect memory leaks and stability issues." >> $GITHUB_STEP_SUMMARY
              ;;
          esac
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | $TEST_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| Virtual Users | ${{ github.event.inputs.thread_count || steps.config.outputs.default_threads }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ramp-up Period | ${{ github.event.inputs.ramp_up || steps.config.outputs.default_ramp_up }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Duration | ${{ github.event.inputs.duration || steps.config.outputs.default_duration }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Target URL | https://preview.owasp-juice.shop |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f ./results/log.jtl ]; then
            echo "### Results" >> $GITHUB_STEP_SUMMARY
            echo "Test execution completed. Results available at:" >> $GITHUB_STEP_SUMMARY
            echo "- **GitHub Pages**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifacts**: Download from this workflow run" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Status" >> $GITHUB_STEP_SUMMARY
            echo "Test execution failed to generate results. Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Success Criteria" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| P95 Response Time | <= 800ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Error Rate | <= 1% |" >> $GITHUB_STEP_SUMMARY
          echo "| Throughput | >= 10 RPS |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-${{ steps.config.outputs.test_type }}-results-${{ github.run_number }}
          path: ./results/
          retention-days: 30

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy Dashboard to gh-pages branch
        if: always()
        run: |
          # Save docs folder content to temp
          cp -r ./docs /tmp/docs-deploy

          # Clone gh-pages branch into separate directory
          git clone --single-branch --branch gh-pages https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git /tmp/gh-pages 2>/dev/null || {
            # Branch doesn't exist, create it
            mkdir -p /tmp/gh-pages
            cd /tmp/gh-pages
            git init
            git checkout -b gh-pages
            git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          }

          # Copy new content
          cd /tmp/gh-pages
          rm -rf ./* 2>/dev/null || true
          cp -r /tmp/docs-deploy/* .

          # Configure git and commit
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dashboard - $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
            git push origin gh-pages --force
            echo "Dashboard deployed to gh-pages branch"
          fi

      - name: Cleanup workspace
        if: always()
        run: |
          echo "Cleaning up large files..."
          if [ -f ./results/log.jtl ]; then
            rm ./results/log.jtl
            echo "Removed JTL file from workspace (preserved in artifacts)"
          fi
          echo "Workspace cleanup completed"
